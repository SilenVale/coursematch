# Render Blueprint — CourseMatch dev 环境
# 在 Render Dashboard: New > Blueprint > 连接本仓库
# Zeabur 替代方案说明见 docs/deploy/dev-render.md

databases:
  - name: coursematch-db
    plan: free
    region: oregon
    databaseName: coursematch
    user: coursematch

services:
  - type: web
    name: coursematch-dev
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "1"
      - key: RUN_SEED
        value: "1"
      - key: SESSION_HOURS
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: coursematch-db
          property: connectionString
      - key: WEB_ORIGIN
        value: https://coursematch-dev.onrender.com
